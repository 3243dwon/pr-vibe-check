name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Maintains a "release PR" from your Conventional Commits. Merging it tags
  # vX.Y.Z and publishes a GitHub Release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      major: ${{ steps.rp.outputs.major }}
      minor: ${{ steps.rp.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: node

  # On each release, force-move the floating major (v1) and minor (v1.2) tags to
  # the released commit, so anyone pinning `@v1` automatically gets the update.
  tag-major:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if dist/ drifted from source
        run: |
          if [ -n "$(git status --porcelain dist/index.js)" ]; then
            echo "::error::dist/ is stale at release time — rebuild and commit before releasing."
            exit 1
          fi
      - name: Move floating major/minor tags
        env:
          MAJOR: v${{ needs.release-please.outputs.major }}
          MINOR: v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR"
          git tag -f "$MINOR"
          git push -f origin "$MAJOR"
          git push -f origin "$MINOR"
          echo "Moved $MAJOR and $MINOR -> ${{ needs.release-please.outputs.tag_name }}"
