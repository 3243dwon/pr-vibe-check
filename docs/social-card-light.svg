<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="PR Vibe Check — a Gen Z code reviewer for your pull requests (light theme)">
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B7DF7"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#F5F1E8"/>
  <rect width="1280" height="6" fill="url(#violet)"/>

  <!-- ===== left column ===== -->
  <rect x="84" y="84" width="14" height="14" rx="3" fill="url(#violet)"/>
  <text x="108" y="96" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#8B8498">GITHUB ACTION · AI</text>

  <path d="M612 120 L619 141 L640 148 L619 155 L612 176 L605 155 L584 148 L605 141 Z" fill="url(#violet)" opacity="0.95"/>

  <text x="80" y="214" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="78" fill="#221C33">PR Vibe Check™</text>
  <rect x="82" y="236" width="96" height="6" rx="3" fill="url(#violet)"/>

  <text x="82" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#5A5468">Your CI checks types.</text>
  <text x="82" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#221C33">Does it check vibes? 🔥</text>

  <text x="82" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" letter-spacing="2" fill="#9A93A6">SEVERITY</text>
  <rect x="82" y="416" width="86" height="36" rx="18" fill="none" stroke="#D9D2C4" stroke-width="1.5"/>
  <text x="125" y="439" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8B8498">soft</text>
  <rect x="180" y="416" width="116" height="36" rx="18" fill="url(#violet)"/>
  <text x="238" y="439" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#FFFFFF">normal</text>
  <rect x="308" y="416" width="104" height="36" rx="18" fill="none" stroke="#D9D2C4" stroke-width="1.5"/>
  <text x="360" y="439" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8B8498">brutal</text>

  <rect x="82" y="582" width="12" height="12" rx="3" fill="url(#violet)"/>
  <text x="104" y="592" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#8B8498">github.com/3243dwon/pr-vibe-check</text>

  <text x="1196" y="96" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#9A93A6">MIT · CLAUDE · @v1</text>

  <!-- ===== right column: mock vibe-check comment ===== -->
  <rect x="700" y="120" width="496" height="416" rx="18" fill="#FFFFFF" stroke="#E6E0D2" stroke-width="1.5"/>

  <circle cx="734" cy="162" r="6" fill="url(#violet)"/>
  <text x="750" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#4A4458">🔍 PR Vibe Check™</text>

  <text x="732" y="208" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#7C5CFC">✨ THE VIBE</text>
  <text x="732" y="232" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#221C33">Clean refactor — understood the assignment.</text>

  <text x="732" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2DA44E">🔥 SLAY MOMENTS</text>
  <text x="732" y="292" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4458">Separation of concerns? It ate.</text>

  <text x="732" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#E5534B">💀 L MOMENTS</text>
  <text x="732" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4A4458">That 2019 TODO lives rent free.</text>

  <line x1="732" y1="380" x2="1164" y2="380" stroke="#E6E0D2" stroke-width="1.5" stroke-dasharray="2 6"/>

  <text x="732" y="416" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#9A93A6">🎯 VERDICT</text>
  <text x="732" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#221C33">W — but evict that TODO fr</text>

  <text x="1164" y="416" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#9A93A6">📊 RATING</text>
  <text x="1164" y="448" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#221C33"><tspan fill="#7C5CFC">7</tspan>/10</text>

  <text x="732" y="500" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9A93A6">One self-updating comment per pull request.</text>
</svg>
