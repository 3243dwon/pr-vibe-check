<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="PR Vibe Check — a cursed pull request scores 18 out of 100">
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5534B"/>
      <stop offset="0.5" stop-color="#E3B341"/>
      <stop offset="1" stop-color="#56D364"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#15131C"/>
  <rect width="1280" height="6" fill="url(#violet)"/>

  <!-- ===== left column ===== -->
  <rect x="84" y="84" width="14" height="14" rx="3" fill="url(#violet)"/>
  <text x="108" y="96" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#8E87A0">GITHUB ACTION</text>

  <path d="M624 118 L631 139 L652 146 L631 153 L624 174 L617 153 L596 146 L617 139 Z" fill="url(#violet)" opacity="0.9"/>

  <text x="80" y="222" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="#F4F0E6">PR Vibe Check</text>
  <rect x="82" y="244" width="96" height="6" rx="3" fill="url(#violet)"/>

  <text x="82" y="306" font-family="'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#B9B3A6">Catches the 2am "fix" with no</text>
  <text x="82" y="344" font-family="'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#B9B3A6">description before your reviewer does.</text>

  <text x="82" y="416" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" letter-spacing="2" fill="#6E6880">WHERE THIS PR LANDS</text>
  <rect x="82" y="430" width="520" height="12" rx="6" fill="url(#scale)"/>
  <path d="M176 446 L167 460 L185 460 Z" fill="#F4F0E6"/>
  <text x="82" y="486" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#6E6880">0</text>
  <text x="176" y="486" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#F4F0E6">18</text>
  <text x="602" y="486" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#6E6880">100</text>

  <rect x="82" y="582" width="12" height="12" rx="3" fill="url(#violet)"/>
  <text x="104" y="592" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#6E6880">github.com/3243dwon/pr-vibe-check</text>

  <text x="1196" y="96" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#6E6880">MIT · NODE 20 · @v1</text>

  <!-- ===== right column: cursed comment card ===== -->
  <rect x="700" y="120" width="496" height="416" rx="18" fill="#1C1926" stroke="#2C2838" stroke-width="1"/>

  <circle cx="734" cy="162" r="6" fill="url(#violet)"/>
  <text x="750" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#C9C3D6">PR Vibe Check</text>
  <path d="M1158 150 L1163 162 L1175 167 L1163 172 L1158 184 L1153 172 L1141 167 L1153 162 Z" fill="url(#violet)" opacity="0.85"/>

  <text x="732" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#F4F0E6">18</text>
  <text x="820" y="252" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#8E87A0">/ 100</text>
  <text x="922" y="252" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#E5534B">Cursed vibes</text>

  <!-- meter: 2 of 10 filled (red) -->
  <g>
    <rect x="732" y="284" width="34" height="16" rx="5" fill="#E5534B"/>
    <rect x="774" y="284" width="34" height="16" rx="5" fill="#E5534B"/>
    <rect x="816" y="284" width="34" height="16" rx="5" fill="none" stroke="#3A3550" stroke-width="1.5"/>
    <rect x="858" y="284" width="34" height="16" rx="5" fill="none" stroke="#3A3550" stroke-width="1.5"/>
    <rect x="900" y="284" width="34" height="16" rx="5" fill="none" stroke="#3A3550" stroke-width="1.5"/>
    <rect x="942" y="284" width="34" height="16" rx="5" fill="none" stroke="#3A3550" stroke-width="1.5"/>
    <rect x="984" y="284" width="34" height="16" rx="5" fill="none" stroke="#3A3550" stroke-width="1.5"/>
    <rect x="1026" y="284" width="34" height="16" rx="5" fill="none" stroke="#3A3550" stroke-width="1.5"/>
    <rect x="1068" y="284" width="34" height="16" rx="5" fill="none" stroke="#3A3550" stroke-width="1.5"/>
    <rect x="1110" y="284" width="34" height="16" rx="5" fill="none" stroke="#3A3550" stroke-width="1.5"/>
  </g>

  <line x1="732" y1="332" x2="1164" y2="332" stroke="#2C2838" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="18">
    <!-- Title: fail -->
    <circle cx="742" cy="368" r="9" fill="#E5534B"/>
    <path d="M738.5 364.5 L745.5 371.5 M745.5 364.5 L738.5 371.5" stroke="#15131C" stroke-width="2" stroke-linecap="round"/>
    <text x="762" y="374" fill="#C9C3D6">Title — "fix" says nothing</text>
    <text x="1164" y="374" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#8E87A0">5/20</text>

    <!-- Description / tests: fail -->
    <circle cx="742" cy="406" r="9" fill="#E5534B"/>
    <path d="M738.5 402.5 L745.5 409.5 M745.5 402.5 L738.5 409.5" stroke="#15131C" stroke-width="2" stroke-linecap="round"/>
    <text x="762" y="412" fill="#C9C3D6">Tests — none touched</text>
    <text x="1164" y="412" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#8E87A0">0/15</text>

    <!-- Size: fail -->
    <circle cx="742" cy="444" r="9" fill="#E5534B"/>
    <path d="M738.5 440.5 L745.5 447.5 M745.5 440.5 L738.5 447.5" stroke="#15131C" stroke-width="2" stroke-linecap="round"/>
    <text x="762" y="450" fill="#C9C3D6">Size — 2,300 lines, reviewers weep</text>
    <text x="1164" y="450" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#8E87A0">4/20</text>
  </g>

  <text x="732" y="506" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6E6880">Set fail-under to block merges below a score.</text>
</svg>
